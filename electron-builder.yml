appId: com.schizzostudio.app
productName: SCHIZZO STUDIO
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - public/icon.png
win:
  target:
    - nsis
    - portable
  icon: public/icon.png
  # Unsigned right now: electron-builder signs automatically, with no other change needed here,
  # once CSC_LINK (path or base64 of the .pfx) and CSC_KEY_PASSWORD are set in the environment —
  # see "Firma de código" in README.md for where to get a certificate and how to set them.
  rfc3161TimeStampServer: http://timestamp.digicert.com
  signingHashAlgorithms:
    - sha256
mac:
  target: dmg
  icon: public/icon.png
  category: public.app-category.graphics-design
linux:
  target: AppImage
  icon: public/icon.png
  category: Graphics
nsis:
  artifactName: SCHIZZO-STUDIO-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: SCHIZZO-STUDIO-Portable-${version}.${ext}
