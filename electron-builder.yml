appId: com.schizzostudio.app
productName: SCHIZZO STUDIO
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target: nsis
  icon: public/icon.png
mac:
  target: dmg
  icon: public/icon.png
  category: public.app-category.graphics-design
linux:
  target: AppImage
  icon: public/icon.png
  category: Graphics
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
