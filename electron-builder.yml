appId: com.schizzostudio.app
productName: SCHIZZO STUDIO
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - public/icon.png
win:
  target:
    - nsis
    - portable
  icon: public/icon.png
mac:
  target: dmg
  icon: public/icon.png
  category: public.app-category.graphics-design
linux:
  target: AppImage
  icon: public/icon.png
  category: Graphics
nsis:
  artifactName: SCHIZZO-STUDIO-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: SCHIZZO-STUDIO-Portable-${version}.${ext}
